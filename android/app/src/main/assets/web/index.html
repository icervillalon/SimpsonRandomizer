<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Simpson Randomizer</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/android.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="cloud" viewBox="0 0 240 120">
      <g fill="#cfe9fb">
        <circle cx="62" cy="78" r="34"/><circle cx="108" cy="58" r="44"/><circle cx="160" cy="66" r="38"/>
        <circle cx="198" cy="86" r="26"/><rect x="34" y="78" width="184" height="36" rx="18"/>
      </g>
      <g fill="#fff">
        <circle cx="62" cy="72" r="32"/><circle cx="108" cy="52" r="42"/><circle cx="160" cy="60" r="36"/>
        <circle cx="198" cy="80" r="24"/><rect x="36" y="72" width="180" height="34" rx="17"/>
      </g>
    </symbol>
  </svg>
  <div class="sky" aria-hidden="true">
    <svg class="cloud c1"><use href="#cloud"/></svg>
    <svg class="cloud c2"><use href="#cloud"/></svg>
    <svg class="cloud c3"><use href="#cloud"/></svg>
    <svg class="cloud c4"><use href="#cloud"/></svg>
    <svg class="cloud c5"><use href="#cloud"/></svg>
    <svg class="cloud c6"><use href="#cloud"/></svg>
  </div>

  <header class="topbar">
    <a class="brand" href="#/">
      <img src="img/donut.svg" alt="" width="40" height="40">
      <span>Simpson Randomizer</span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="ruleta">Ruleta</a>
      <a href="#/capitulos" data-nav="capitulos">Todos los capítulos</a>
    </nav>
  </header>

  <main class="page">
    <!-- Ruleta -->
    <div id="view-ruleta" class="view">
      <section class="panel picker" id="picker">
        <div class="picker-head">
          <h2>Temporadas</h2>
          <output class="range-label" id="range-label" aria-live="polite"></output>
        </div>

        <div class="dual-range">
          <div class="dual-range-track"><div class="dual-range-fill" id="range-fill"></div></div>
          <input type="range" id="season-from" aria-label="Desde la temporada">
          <input type="range" id="season-to" aria-label="Hasta la temporada">
        </div>

        <div class="presets" id="season-presets" role="group" aria-label="Rangos rápidos"></div>

        <details class="rating-filter" id="rating-filter">
          <summary class="picker-head">
            <h2>Nota mínima</h2><span class="chevron" aria-hidden="true"></span>
            <output class="range-label" id="rating-label" aria-live="polite">Cualquiera</output>
          </summary>
          <div class="dual-range">
            <div class="dual-range-track"><div class="dual-range-fill" id="rating-fill"></div></div>
            <input type="range" id="min-rating" min="5" step="0.1" value="5" aria-label="Nota mínima del capítulo">
          </div>
          <div class="presets" id="rating-presets" role="group" aria-label="Notas rápidas">
            <button type="button" class="chip" data-rating="5">Cualquiera</button>
            <button type="button" class="chip" data-rating="7">★ 7 o más</button>
            <button type="button" class="chip" data-rating="7.5">★ 7,5 o más</button>
            <button type="button" class="chip" data-rating="8">★ 8 o más</button>
          </div>
        </details>

        <p class="match-count" id="match-count" aria-live="polite"></p>

        <button type="button" class="btn-spin" id="spin">
          <img src="img/donut.svg" alt="" width="44" height="44">
          <span>¡Dame un capítulo!</span>
        </button>
      </section>

      <section id="result" class="result" aria-live="polite"></section>
    </div>

    <!-- Catálogo -->
    <div id="view-capitulos" class="view" hidden>
      <section class="hero hero-small">
        <h1 class="logo-title" data-wobbly="Todos los capítulos"></h1>
        <p class="hero-sub" id="catalog-sub"></p>
      </section>
      <div class="catalog-tools panel">
        <label class="search">
          <span class="visually-hidden">Buscar capítulo</span>
          <input type="search" id="search" placeholder="Buscar por título o sinopsis…" autocomplete="off">
        </label>
        <nav class="season-chips" id="season-chips" aria-label="Ir a temporada"></nav>
        <p class="search-empty" id="search-empty" hidden>Ningún capítulo coincide. ¡Ay, caramba!</p>
      </div>
      <div id="catalog-list"></div>
    </div>

    <!-- Ficha de capítulo -->
    <div id="view-capitulo" class="view" hidden></div>
  </main>

  <footer class="footer">
    <p id="data-source"></p>
    <p>Proyecto personal sin relación con Disney, 20th Television ni Gracie Films.</p>
  </footer>

  <script src="data/episodes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
