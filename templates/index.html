{% extends "base.html" %}

{% block content %}

<section class="panel picker" id="picker"
         data-first="{{ first_season }}" data-last="{{ last_season }}"
         data-from="{{ season_from }}" data-to="{{ season_to }}">
  {% include "_filters.html" %}

  <button type="button" class="btn-spin" id="spin">
    <img src="{{ url_for('static', filename='img/donut.svg') }}" alt="" width="44" height="44">
    <span>¡Dame un capítulo!</span>
  </button>
</section>

<section id="result" class="result" aria-live="polite"></section>

{% include "_episode_template.html" %}
{% endblock %}
